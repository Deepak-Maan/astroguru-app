name: Auto OTA Update on Git Push

on:
  push:
    branches:
      - main

jobs:
  publish-ota-update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ⚡ Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Publish Expo OTA Update to Main Branch & Production Channel
        run: |
          eas update --branch main --message "Auto OTA Update via GitHub Actions [${{ github.sha }}]" --non-interactive
          eas update --channel production --message "Production OTA Update via GitHub Actions [${{ github.sha }}]" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🌐 Build Production Web Bundle
        run: npm run build:web

